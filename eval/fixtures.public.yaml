# ── edge cases LLM should get right ──────────────────────────────────────────
  - email:
      id: pub-e-1
      thread_id: pub-e-1
      account: public
      from_email: orders@shipped.example.com
      from_name: Shipped
      to: [me@example.com]
      subject: "Order #12345 has been shipped"
      snippet: "Your order is on its way."
      headers:
        From: "Shipped <orders@shipped.example.com>"
        Subject: "Order #12345 has been shipped"
        List-Unsubscribe: "<mailto:unsub@shipped.example.com>"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: newsletters
    notes: "Order shipping notification with List-Unsubscribe → newsletters rule"

  - email:
      id: pub-e-2
      thread_id: pub-e-2
      account: public
      from_email: recruiter@coldstartup.example
      from_name: Recruiter X
      to: [me@example.com]
      subject: "Exciting opportunity for a CTO role"
      snippet: "Hi there, I came across your profile and wanted to share an opportunity."
