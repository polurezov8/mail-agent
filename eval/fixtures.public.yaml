        From: "Recruiter X <recruiter@coldstartup.example>"
        Subject: "Exciting opportunity for a CTO role"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    notes: "Cold recruiter outreach — LLM should classify ignore per NL rules"
