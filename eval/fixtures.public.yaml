# Public, synthetic eval fixtures. Safe to commit (no personal mail).
# Covers all three buckets so regression gating catches respond/notify drift,
# not just ignore. Pair with eval/fixtures.yaml (gitignored personal cases).
examples:

# ── ignore: header-rule hits (deterministic) ─────────────────────────────────
  - email:
      id: pub-i-1
      thread_id: pub-i-1
      account: public
      from_email: notifications@github.com
      from_name: GitHub
      to: [me@example.com]
      subject: "[org/repo] PR #42 was merged"
      snippet: "Your pull request has been merged into main."
      headers:
        From: "GitHub <notifications@github.com>"
        Subject: "[org/repo] PR #42 was merged"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: github_notifications

  - email:
      id: pub-i-2
      thread_id: pub-i-2
      account: public
      from_email: invitations@linkedin.com
      from_name: LinkedIn
      to: [me@example.com]
      subject: "I want to connect"
      snippet: "Jane Doe wants to connect with you on LinkedIn."
      headers:
        From: "LinkedIn <invitations@linkedin.com>"
        Subject: "I want to connect"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: linkedin_notifications

  - email:
      id: pub-i-3
      thread_id: pub-i-3
      account: public
      from_email: no-reply@email.apple.com
      from_name: Apple
      to: [me@example.com]
      subject: "You will be charged for your iCloud+ plan in 2 days"
      snippet: "Your subscription will renew on 2026-05-23."
      headers:
        From: "Apple <no-reply@email.apple.com>"
        Subject: "You will be charged for your iCloud+ plan in 2 days"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: apple_notifications

  - email:
      id: pub-i-4
      thread_id: pub-i-4
      account: public
      from_email: newsletter@techcrunch.com
      from_name: TechCrunch
      to: [me@example.com]
      subject: "TechCrunch Daily: weekly IT digest"
      snippet: "Weekly overview of tech industry news."
      headers:
        From: "TechCrunch <newsletter@techcrunch.com>"
        Subject: "TechCrunch Daily: weekly IT digest"
        List-Unsubscribe: "<mailto:unsub@techcrunch.com>"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: newsletters

  - email:
      id: pub-i-5
      thread_id: pub-i-5
      account: public
      from_email: noreply@medium.com
      from_name: Medium Daily Digest
      to: [me@example.com]
      subject: "Today's highlights"
      snippet: "Stories picked for you."
      headers:
        From: "Medium <noreply@medium.com>"
        Subject: "Today's highlights"
        List-Unsubscribe: "<mailto:unsub@medium.com>"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: newsletters

  - email:
      id: pub-i-6
      thread_id: pub-i-6
      account: public
      from_email: noreply@notifications.slack.com
      from_name: Slack
      to: [me@example.com]
      subject: "You have 3 new messages in #engineering"
      snippet: "Catch up on what you missed."
      headers:
        From: "Slack <noreply@notifications.slack.com>"
        Subject: "You have 3 new messages in #engineering"
      received_at: "2026-05-21T08:00:00+00:00"
    expected_bucket: ignore
    expected_rule_name: slack_notifications

